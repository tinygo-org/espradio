name: Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tinygo-org/tinygo-dev
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install QEMU
        run: apt-get update && apt-get install -y qemu-system-misc
      - name: TinyGo version check
        run: tinygo version
      - name: Enforce Go Formatted Code
        run: make fmt-check
      - name: Run unit tests
        run: |
            go env -w GOFLAGS=-buildvcs=false
            make unit-test

  smoke-test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tinygo-org/tinygo-dev
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        target: [xiao-esp32c3, xiao-esp32s3, esp32-mini32, xiao-esp32c6]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: TinyGo version check
        run: tinygo version
      - name: Smoke test examples
        run: |
            go env -w GOFLAGS=-buildvcs=false
            make smoke-test SMOKE_TARGETS=${{ matrix.target }} SMOKE_JOBS=$(nproc)
